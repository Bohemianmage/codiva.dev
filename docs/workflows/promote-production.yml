# Optional fallback if Codiva cannot call the Vercel promote API.
# Copy to the client repo: .github/workflows/promote-production.yml
#
# Repo secret: VERCEL_TOKEN
# Optional: GitHub Environment "production" with required reviewers.

name: Promote production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Preview deployment URL to promote
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: npm i -g vercel@39
      - run: vercel promote "${{ inputs.deployment_url }}" --token=${{ secrets.VERCEL_TOKEN }} --yes
