# CI then Vercel preview. Production is promoted from Codiva, not from this workflow.
# Copy to the client repo: .github/workflows/preview.yml
#
# Repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# In Vercel: disable Git auto-deploys (vercel.json git.deploymentEnabled=false).
#
# main never deploys Incoming. A green CI on main fast-forwards preview/ops-release,
# which then runs the preview job.

name: Preview

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present

  preview:
    needs: ci
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Vercel preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$BRANCH" \
            --meta githubCommitAuthorName="$GITHUB_ACTOR")
          echo "Preview: $url"

  sync-ops-preview:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fast-forward preview/ops-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="preview/ops-release"
          SHA="${GITHUB_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/tmp/ref.json 2>/dev/null; then
            current=$(jq -r .object.sha /tmp/ref.json)
            if [ "$current" = "$SHA" ]; then
              echo "Already at $SHA"
              exit 0
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$SHA" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$SHA"
          fi
